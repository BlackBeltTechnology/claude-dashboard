name: Build project

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
